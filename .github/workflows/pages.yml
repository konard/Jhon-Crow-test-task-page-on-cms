name: Test and deploy page

on:
  push:
    branches:
      - main
      - issue-4-fce902db2f96
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-pages:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Render static site
        run: |
          mkdir -p dist/assets dist/content
          php public/index.php > dist/index.html
          cp public/favicon.svg dist/favicon.svg
          cp public/assets/styles.css dist/assets/styles.css
          cp public/content/home.json dist/content/home.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Switch Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api repos/${{ github.repository }}/pages --jq '.build_type')
          if [ "$BUILD_TYPE" != "workflow" ]; then
            gh api -X PUT repos/${{ github.repository }}/pages \
              --field build_type=workflow \
              --silent && echo "Switched Pages source to GitHub Actions workflow" \
              || echo "Could not switch Pages source (requires repo admin permissions)"
          else
            echo "Pages source already set to GitHub Actions workflow"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
